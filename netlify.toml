# Next.js inlines env values into compiled server, edge, and client output.
# Netlify then scans that output and fails the deploy if a marked-secret
# value appears — including public Supabase keys that must ship to the browser.
# Keep scanning the repo; skip compiled artifacts.

[build.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://gtkkewhlhvendkmzvpbi.supabase.co"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".next,.netlify"
